<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Team API — Org Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --ink-muted:   #898781;
    --border:      #e1e0d9;
    --brand:       #7c3aed;
    --brand-bg:    #ede9fe;
    --good:        #0ca30c;
    --warning:     #fab219;
    --critical:    #d03b3b;
    --type-stream-aligned:         #2a78d6;
    --type-platform:               #eb6834;
    --type-complicated-subsystem:  #1baf7a;
    --type-enabling:                #eda100;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface:     #1a1a19;
      --ink:         #ffffff;
      --ink-2:       #c3c2b7;
      --ink-muted:   #898781;
      --border:      #2c2c2a;
      --brand-bg:    rgba(124, 58, 237, 0.22);
      --type-stream-aligned:         #3987e5;
      --type-platform:               #d95926;
      --type-complicated-subsystem:  #199e70;
      --type-enabling:                #c98500;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface:     #1a1a19;
    --ink:         #ffffff;
    --ink-2:       #c3c2b7;
    --ink-muted:   #898781;
    --border:      #2c2c2a;
    --brand-bg:    rgba(124, 58, 237, 0.22);
    --type-stream-aligned:         #3987e5;
    --type-platform:               #d95926;
    --type-complicated-subsystem:  #199e70;
    --type-enabling:                #c98500;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.45;
  }
  a { color: var(--brand); }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 64px;
  }
  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  header.top h1 {
    font-size: 1.5rem;
    margin: 0;
  }
  header.top .sub {
    color: var(--ink-2);
    font-size: 0.9rem;
  }
  input#search {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.9rem;
    width: 220px;
  }
  input#search:focus { outline: 2px solid var(--brand); outline-offset: 1px; }

  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  section h2 {
    font-size: 1rem;
    margin: 0 0 14px;
    color: var(--ink-2);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  #search-results { margin-top: 10px; font-size: 0.9rem; color: var(--ink-2); }
  #search-results ul { list-style: none; margin: 6px 0 0; padding: 0; }
  #search-results li { padding: 4px 0; border-bottom: 1px solid var(--border); }
  #search-results li:last-child { border-bottom: none; }
  .search-kind {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--ink-muted);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0 5px;
    margin-right: 8px;
    text-transform: uppercase;
  }

  .load-row {
    display: grid;
    grid-template-columns: 160px 1fr 90px;
    align-items: center;
    gap: 12px;
    padding: 7px 0;
  }
  .load-row .name { font-size: 0.9rem; }
  .load-bar-track {
    background: var(--border);
    border-radius: 5px;
    height: 10px;
    overflow: hidden;
  }
  .load-bar-fill { height: 100%; border-radius: 5px 0 0 5px; }
  .load-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.78rem;
    justify-content: flex-end;
    white-space: nowrap;
  }
  .load-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  /* Distinguished by the 🤖 glyph and a border, not by colour alone. */
  .load-supervision {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 6px;
    flex: none;
  }

  .teams-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
  }
  .team-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .team-card h3 { margin: 0 0 4px; font-size: 0.95rem; }
  .team-card .focus { color: var(--ink-2); font-size: 0.82rem; margin: 4px 0 8px; }
  .type-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    color: var(--ink-2);
  }
  .type-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .tabs button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-2);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .tabs button.active {
    background: var(--brand-bg);
    border-color: var(--brand);
    color: var(--brand);
    font-weight: 600;
  }
  #diagram {
    overflow-x: auto;
    min-height: 120px;
  }
  #diagram .placeholder { color: var(--ink-muted); font-size: 0.9rem; }

  .checks-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }
  .check-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    background: var(--surface);
  }
  .check-card h3 { margin: 0 0 6px; font-size: 0.95rem; }
  .check-count { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
  .check-sub { color: var(--ink-muted); font-size: 0.8rem; margin-top: 2px; }
  .findings { margin-top: 12px; }
  .finding {
    display: flex;
    gap: 8px;
    align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.85rem;
  }
  .finding:last-child { border-bottom: none; }
  .finding-kind {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.75rem;
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .sev-blocking { color: #b91c1c; font-weight: 600; }
  .sev-warning { color: #b45309; }
  .sev-info { color: var(--ink-muted); }
  .team-card { cursor: pointer; }
  .team-card:hover { border-color: var(--accent); }
  .detail-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
    z-index: 10;
  }
  .detail-panel {
    background: var(--surface);
    border-radius: 12px;
    max-width: 720px;
    width: 100%;
    padding: 24px 28px;
    box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
  }
  .detail-panel h2 { margin-top: 0; }
  .detail-close {
    float: right;
    border: 1px solid var(--line);
    background: none;
    border-radius: 6px;
    cursor: pointer;
    padding: 4px 10px;
    font-size: 0.85rem;
  }
  .detail-section { margin-top: 18px; }
  .detail-section h4 {
    margin: 0 0 6px;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-muted);
  }
  .detail-list { margin: 0; padding-left: 18px; font-size: 0.88rem; }
  .detail-list li { margin: 3px 0; }
  .vacant { color: #b45309; }

  /* The proposal form. Deliberately plain: this is a change request, not a settings screen, and
     anything that looks like a settings screen implies the change takes effect when you save it. */
  .propose-form { display: grid; gap: 10px; }
  .propose-form label { display: grid; gap: 4px; font-size: 0.82rem; color: var(--ink-muted); }
  .propose-form input, .propose-form textarea {
    font: inherit;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
  }
  .propose-scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .propose-actions { display: flex; gap: 8px; align-items: center; }
  .propose-actions button {
    font: inherit;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
  }
  .propose-note { font-size: 0.8rem; color: var(--ink-muted); }
  .propose-result { font-size: 0.85rem; }
  .propose-result.error { color: #b45309; }
  .proposal-impact { display: grid; gap: 10px; margin-top: 8px; }
  .proposal-impact header { display: flex; align-items: baseline; gap: 8px; }
  .proposal-impact strong { font-size: 1.4rem; }
  .proposal-impact .components { display: grid; grid-template-columns: repeat(5, minmax(90px, 1fr)); gap: 6px; }
  .proposal-impact .component { border: 1px solid var(--line); border-radius: 6px; padding: 6px; text-align: center; }
  .proposal-impact .diagram { overflow-x: auto; padding: 6px; background: var(--bg); border-radius: 6px; }

  /* The AI-native sections. Same visual language as the team cards, because they answer the same
     shape of question — what exists, who owns it, what is unaccounted for. */
  .stat-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .stat {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    background: var(--panel);
    min-width: 110px;
  }
  .stat .value { font-size: 1.4rem; font-weight: 600; }
  .stat .label { font-size: 0.75rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat.warn .value { color: var(--warning); }

  .row-list { display: grid; gap: 4px; font-size: 0.86rem; }
  .row-list .row {
    display: flex;
    gap: 8px;
    align-items: baseline;
    padding: 5px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
  }
  .row-list .row .team { color: var(--ink-muted); font-size: 0.78rem; }
  .row-list .row .grow { flex: 1; }
  .chip {
    font-size: 0.72rem;
    padding: 1px 6px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .chip.unowned { color: var(--critical); border-color: var(--critical); }
  .chip.inactive { opacity: 0.65; }

  .kg-controls { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .kg-controls select, .kg-controls input {
    font: inherit;
    padding: 5px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
  }

  footer {
    text-align: center;
    color: var(--ink-muted);
    font-size: 0.8rem;
    margin-top: 32px;
  }
  footer a { color: var(--ink-muted); }
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>🧭 Team API — Org Dashboard</h1>
      <div class="sub" id="org-summary">Loading…</div>
    </div>
    <div>
      <input id="search" type="search" placeholder="Search teams, services, roles…" autocomplete="off" />
      <div id="search-results"></div>
    </div>
  </header>

  <section>
    <h2>Cognitive load</h2>
    <div id="load-list"></div>
  </section>

  <section>
    <h2>Health</h2>
    <div class="checks-grid" id="checks-grid"></div>
    <div class="findings" id="findings"></div>
  </section>

  <section>
    <h2>Teams</h2>
    <div class="teams-grid" id="teams-grid"></div>
  </section>

  <section>
    <h2>AI agents</h2>
    <div class="stat-row" id="agent-stats"></div>
    <div class="row-list" id="agent-list"></div>
  </section>

  <section>
    <h2>Sessions</h2>
    <div class="row-list" id="session-list"></div>
  </section>

  <section>
    <h2>Knowledge graph</h2>
    <div class="kg-controls">
      <select id="kg-node"></select>
      <label class="propose-note">depth
        <input id="kg-depth" type="number" min="1" max="4" value="2" style="width:60px" />
      </label>
      <span class="propose-note" id="kg-summary"></span>
    </div>
    <div class="row-list" id="kg-list"></div>
  </section>

  <section>
    <h2>Context map</h2>
    <div class="row-list" id="context-map-list"></div>
  </section>

  <section>
    <h2>Diagram</h2>
    <div class="tabs" id="diagram-tabs">
      <button data-scope="topology" class="active">Topology</button>
      <button data-scope="org-hierarchy">Org hierarchy</button>
      <button data-scope="context-map">Context map</button>
    </div>
    <div id="diagram"><span class="placeholder">Loading diagram…</span></div>
  </section>

  <div id="detail-root"></div>

  <footer>
    Rendered from a live <a href="/docs">REST API</a> — <a href="https://github.com/JGalego/TeamAPI">TeamAPI</a>
  </footer>
</main>

<script type="module">
  // Loaded lazily (not a static top-level import) and wrapped in try/catch: a static import that
  // fails to resolve aborts the *entire* module — every other section below with it. Diagrams are
  // the one thing on this page that need Mermaid; the team list, cognitive load, and search must
  // keep working even on a network that blocks the CDN (a real scenario for an internal-org
  // dashboard, not just a test-environment quirk).
  let mermaidModulePromise;
  function loadMermaid() {
    if (!mermaidModulePromise) {
      mermaidModulePromise = import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs").then(
        (mod) => {
          mod.default.initialize({ startOnLoad: false, securityLevel: "strict" });
          return mod.default;
        },
      );
    }
    return mermaidModulePromise;
  }

  const STATUS = {
    sustainable: { color: "var(--good)", icon: "✓" },
    elevated: { color: "var(--warning)", icon: "▲" },
    overloaded: { color: "var(--critical)", icon: "⛔" },
  };
  const TYPE_VAR = {
    "stream-aligned": "--type-stream-aligned",
    platform: "--type-platform",
    "complicated-subsystem": "--type-complicated-subsystem",
    enabling: "--type-enabling",
  };

  function h(tag, attrs = {}, children = []) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v);
    }
    for (const child of [].concat(children)) {
      if (child) el.appendChild(child);
    }
    return el;
  }

  // Which optional surfaces this server actually has. Asked once, at startup, because offering an
  // edit button that 404s is worse than not offering one.
  let proposalsEnabled = false;

  async function loadCapabilities() {
    try {
      const health = await getJson("/health");
      proposalsEnabled = Boolean(health.capabilities && health.capabilities.proposals);
    } catch {
      // A server too old to report capabilities is a server without them.
      proposalsEnabled = false;
    }
  }

  async function getJson(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${url}: ${res.status}`);
    return res.json();
  }

  async function loadSummary() {
    const teams = await getJson("/teams");
    document.getElementById("org-summary").textContent =
      `${teams.length} team${teams.length === 1 ? "" : "s"}`;
    return teams;
  }

  async function loadCognitiveLoad() {
    const report = await getJson("/cognitive-load");
    const list = document.getElementById("load-list");
    list.innerHTML = "";
    if (report.length === 0) {
      list.appendChild(h("div", { class: "placeholder", text: "No teams have a cognitive-load assessment yet." }));
      return;
    }
    const max = Math.max(...report.map((r) => r.total), 1);
    for (const r of report) {
      const status = STATUS[r.label] ?? STATUS.sustainable;
      const row = h("div", { class: "load-row" }, [
        h("div", { class: "name", text: r.teamId }),
        h("div", { class: "load-bar-track" }, [
          h("div", {
            class: "load-bar-fill",
            style: `width:${Math.round((r.total / max) * 100)}%;background:${status.color}`,
          }),
        ]),
        h("div", { class: "load-badge" }, [
          h("span", { class: "load-dot", style: `background:${status.color}` }),
          h("span", { text: `${status.icon} ${r.total} · ${r.label}` }),
          // Supervision is reported but never folded into `total`, so it gets its own chip rather
          // than widening the bar — the bar has to keep meaning the same thing across teams that
          // have scored it and teams that haven't.
          ...(r.assessment && r.assessment.supervision !== undefined
            ? [h("span", { class: "load-supervision", title: "Agent supervision load — not counted in the total, but it can raise the label", text: `🤖 ${r.assessment.supervision}` })]
            : []),
        ]),
      ]);
      list.appendChild(row);
    }
  }

  function renderTeamCards(teams) {
    const grid = document.getElementById("teams-grid");
    grid.innerHTML = "";
    for (const team of teams) {
      const typeVar = TYPE_VAR[team.type] ?? "--ink-muted";
      const card = h("div", { class: "team-card", role: "button", tabindex: "0" }, [
          h("h3", { text: team.name }),
          team.focus ? h("div", { class: "focus", text: team.focus }) : null,
          h("span", { class: "type-chip" }, [
            h("span", { class: "type-dot", style: `background:var(${typeVar})` }),
            h("span", { text: team.type }),
          ]),
        ]);
      card.addEventListener("click", () => openTeam(team.id));
      // Keyboard too: the card is a button in everything but element name, and a grid that only
      // opens on a mouse click is a grid half the org cannot use.
      card.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openTeam(team.id);
        }
      });
      grid.appendChild(card);
    }
  }


  const SEVERITY_RANK = { blocking: 0, warning: 1, info: 2 };

  /**
   * The three graph-only checks, in one place.
   *
   * Each is a pure function of the resolved graph, so the page can ask for all three at once and
   * show a whole-org verdict without anyone having run a report. `Promise.allSettled`, not `all`:
   * one endpoint failing must not blank the other two, which is exactly what would happen on a
   * server built before these routes existed.
   */
  async function loadChecks() {
    const grid = document.getElementById("checks-grid");
    const findingsEl = document.getElementById("findings");
    grid.innerHTML = "";
    findingsEl.innerHTML = "";

    const [gaps, policy, topology] = await Promise.allSettled([
      getJson("/gaps"),
      getJson("/policy"),
      getJson("/topology"),
    ]);

    const collected = [];

    const card = (title, state, describe) => {
      if (state.status !== "fulfilled") {
        grid.appendChild(
          h("div", { class: "check-card" }, [
            h("h3", { text: title }),
            h("div", { class: "check-sub", text: "Unavailable on this server" }),
          ]),
        );
        return;
      }
      const { count, sub, findings } = describe(state.value);
      collected.push(...findings);
      grid.appendChild(
        h("div", { class: "check-card" }, [
          h("h3", { text: title }),
          h("div", { class: "check-count", text: String(count) }),
          h("div", { class: "check-sub", text: sub }),
        ]),
      );
    };

    card("Gaps", gaps, (report) => ({
      count: report.findings.length,
      sub: `${report.findings.filter((f) => f.severity === "blocking").length} blocking · ${report.matched} seam(s) checked`,
      findings: report.findings.map((f) => ({ group: "gap", kind: f.kind, severity: f.severity, detail: f.detail })),
    }));

    card("Policy", policy, (report) => ({
      count: report.findings.length,
      sub: `${report.satisfied}/${report.evaluated} checked here pass · ${report.total} declared`,
      findings: report.findings.map((f) => ({
        group: "policy",
        kind: f.outcome,
        severity: f.severity,
        detail: `${f.teamId} / ${f.policyId}: ${f.detail}`,
      })),
    }));

    card("Topology", topology, (report) => ({
      count: report.findings.length,
      sub: `${report.teams} team(s) checked`,
      findings: report.findings.map((f) => ({
        group: "topology",
        kind: f.kind,
        severity: f.severity,
        detail: `${f.teamId}: ${f.detail}`,
      })),
    }));

    if (collected.length === 0) {
      findingsEl.appendChild(h("div", { class: "placeholder", text: "Nothing to report — every check is clean." }));
      return;
    }

    // Most serious first: a blocking finding buried under twenty warnings is a finding nobody acts on.
    collected.sort((a, b) => (SEVERITY_RANK[a.severity] ?? 3) - (SEVERITY_RANK[b.severity] ?? 3));
    for (const finding of collected) {
      findingsEl.appendChild(
        h("div", { class: "finding" }, [
          h("span", { class: `finding-kind sev-${finding.severity}`, text: finding.kind }),
          h("span", { text: finding.detail }),
        ]),
      );
    }
  }

  function detailList(items, empty) {
    if (!items || items.length === 0) return h("div", { class: "placeholder", text: empty });
    return h("ul", { class: "detail-list" }, items.map((item) => h("li", item)));
  }

  function closeDetail() {
    document.getElementById("detail-root").innerHTML = "";
  }

  /**
   * The team detail panel.
   *
   * The card grid answers "what teams are there"; almost every actual question is about one team —
   * who is on it, what it owns, who it depends on, which roles are vacant. That was all in the API
   * and reachable only by typing URLs.
   */
  async function openTeam(teamId) {
    const root = document.getElementById("detail-root");
    root.innerHTML = "";
    const panel = h("div", { class: "detail-panel" }, [h("div", { class: "placeholder", text: "Loading…" })]);
    const backdrop = h("div", { class: "detail-backdrop" }, [panel]);
    // Click the backdrop to dismiss, but not a click that started inside the panel itself.
    backdrop.addEventListener("click", (event) => {
      if (event.target === backdrop) closeDetail();
    });
    root.appendChild(backdrop);

    let team, staffing, interactions, dependencies, agents;
    try {
      [team, staffing, interactions, dependencies, agents] = await Promise.all([
        getJson(`/teams/${teamId}`),
        // `/roles` answers with `{ roles, members }` — roles alone would not say which are filled.
        getJson(`/teams/${teamId}/roles`),
        getJson(`/teams/${teamId}/interactions`),
        getJson(`/teams/${teamId}/dependencies`),
        // A separate call because the team DTO does not carry the AI-native sections; asking the
        // team document for its agents returns nothing, silently.
        getJson(`/teams/${teamId}/agents`),
      ]);
    } catch (err) {
      panel.innerHTML = "";
      panel.appendChild(h("div", { class: "placeholder", text: `Could not load ${teamId}: ${err}` }));
      return;
    }

    const roles = staffing.roles ?? [];
    const members = staffing.members ?? team.members ?? [];
    const filled = new Set(members.flatMap((m) => m.roleIds ?? []));

    panel.innerHTML = "";
    panel.appendChild(h("button", { class: "detail-close", text: "Close" }));
    panel.querySelector(".detail-close").addEventListener("click", closeDetail);
    panel.appendChild(h("h2", { text: team.name ?? teamId }));
    if (team.focus) panel.appendChild(h("div", { class: "focus", text: team.focus }));

    const section = (title, node) =>
      panel.appendChild(h("div", { class: "detail-section" }, [h("h4", { text: title }), node]));

    section(
      "Roles",
      detailList(
        roles.map((role) => {
          // A vacancy is the thing worth seeing at a glance: it is what `gaps` escalates when
          // another team's reporting line terminates in it.
          const vacant = !filled.has(role.id);
          return vacant ? { class: "vacant", text: `${role.name} (${role.kind}) — vacant` } : { text: `${role.name} (${role.kind})` };
        }),
        "No roles declared.",
      ),
    );

    section(
      "Members",
      detailList(
        members.map((m) => ({ text: m.contact ? `${m.name} · ${m.contact}` : m.name })),
        "No members declared.",
      ),
    );

    section(
      "Services",
      detailList((team.services ?? []).map((svc) => ({ text: svc.name })), "No services declared."),
    );

    section(
      "Agents",
      detailList(
        (agents ?? []).map((agent) => ({
          text: `${agent.name} (${agent.provider}) — ${agent.ownerId ? `owned by ${agent.ownerId}` : "no owner"}`,
        })),
        "No agents declared.",
      ),
    );

    section(
      "Interactions",
      detailList(
        (interactions ?? []).map((edge) => ({ text: `${edge.from} → ${edge.to} (${edge.mode})` })),
        "No interactions declared.",
      ),
    );

    section(
      "Dependencies",
      detailList(
        (dependencies ?? []).map((edge) => ({ text: `${edge.from} → ${edge.to} (${edge.type})` })),
        "No dependencies declared.",
      ),
    );

    if (proposalsEnabled) section("Propose a change", proposeForm(team, teamId));
  }

  /**
   * The write path, such as it is: an edit that becomes a pull request.
   *
   * Two fields and four numbers, which is the whole point. The dashboard is read by people who
   * will never open an editor, and the things most often wrong about a team are what it says it
   * does and how loaded it says it is. Everything structural — refs, ids, interactions — is
   * absent, because changing those changes what every other document resolves to and that belongs
   * in a branch somebody reads.
   *
   * The button says "Open a pull request", not "Save". Nothing here changes the served graph.
   */
  function proposeForm(team, teamId) {
    const load = team.cognitiveLoad ?? {};
    const scoreInput = (name, value) =>
      h("label", { text: name }, [
        h("input", { type: "number", min: "1", max: "10", name, value: value === undefined ? "" : String(value) }),
      ]);

    const form = h("form", { class: "propose-form" }, [
      h("label", { text: "Focus" }, [h("input", { type: "text", name: "focus", value: team.focus ?? "" })]),
      h("div", { class: "propose-scores" }, [
        scoreInput("intrinsic", load.intrinsic),
        scoreInput("extraneous", load.extraneous),
        scoreInput("germane", load.germane),
        scoreInput("supervision", load.supervision),
      ]),
      h("label", { text: "Notes" }, [h("textarea", { name: "notes", rows: "2" })]),
      h("label", { text: "Your name or address (credited in the pull request)" }, [
        h("input", { type: "text", name: "author" }),
      ]),
      h("div", { class: "propose-actions" }, [
        h("button", { type: "button", class: "preview-proposal", text: "Preview impact" }),
        h("button", { type: "submit", text: "Open a pull request" }),
        h("span", { class: "propose-note", text: "Nothing changes until somebody reviews and merges it." }),
      ]),
      h("div", { class: "propose-result" }),
    ]);

    form.querySelector('textarea[name="notes"]').value = load.notes ?? "";

    const value = (name) => form.querySelector(`[name="${name}"]`).value.trim();
    const number = (name) => (value(name) === "" ? undefined : Number(value(name)));
    const patchFromForm = () => {
      const patch = {};
      if (value("focus") && value("focus") !== (team.focus ?? "")) patch.info = { focus: value("focus") };
      if (number("intrinsic") && number("extraneous") && number("germane")) {
        patch.cognitiveLoad = {
          intrinsic: number("intrinsic"),
          extraneous: number("extraneous"),
          germane: number("germane"),
          ...(number("supervision") ? { supervision: number("supervision") } : {}),
          ...(value("notes") ? { notes: value("notes") } : {}),
        };
      }
      return patch;
    };

    form.querySelector(".preview-proposal").addEventListener("click", async () => {
      const result = form.querySelector(".propose-result");
      result.className = "propose-result";
      result.textContent = "Simulating…";
      try {
        const res = await fetch(`/teams/${teamId}/proposals/analyze`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ patch: patchFromForm() }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error ?? `${res.status}`);
        const components = Object.entries(body.score.components).map(([name, entry]) =>
          h("div", { class: "component" }, [
            h("strong", { text: `${entry.score}` }),
            h("div", { text: name.replace(/([A-Z])/g, " $1") }),
          ]),
        );
        const diagram = h("div", { class: "diagram" });
        result.innerHTML = "";
        result.appendChild(
          h("div", { class: "proposal-impact" }, [
            h("header", {}, [
              h("strong", { text: `${body.score.total}/100` }),
              h("span", { text: `${body.score.risk} risk` }),
            ]),
            h("div", { class: "components" }, components),
            diagram,
          ]),
        );
        const mermaid = await loadMermaid();
        const { svg } = await mermaid.render(`proposal-${teamId}-${Date.now()}`, body.diagram);
        diagram.innerHTML = svg;
      } catch (err) {
        result.className = "propose-result error";
        result.textContent = String(err.message ?? err);
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const result = form.querySelector(".propose-result");
      result.className = "propose-result";
      result.textContent = "Opening…";

      const patch = patchFromForm();

      try {
        const res = await fetch(`/teams/${teamId}/proposals`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ patch, author: value("author") || undefined }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error ?? `${res.status}`);
        result.innerHTML = "";
        result.appendChild(h("a", { href: body.url, target: "_blank", rel: "noreferrer", text: `Opened #${body.number} →` }));
      } catch (err) {
        result.className = "propose-result error";
        result.textContent = String(err.message ?? err);
      }
    });

    return form;
  }

  /** One row in a list section: a label, a team attribution, and any number of chips. */
  function row(label, teamId, chips = []) {
    return h("div", { class: "row" }, [
      h("span", { class: "grow", text: label }),
      ...chips.filter(Boolean),
      h("span", { class: "team", text: teamId }),
    ]);
  }

  function stat(value, label, warn = false) {
    return h("div", { class: warn && Number(value) > 0 ? "stat warn" : "stat" }, [
      h("div", { class: "value", text: String(value) }),
      h("div", { class: "label", text: label }),
    ]);
  }

  function fillList(id, rows, empty) {
    const list = document.getElementById(id);
    list.innerHTML = "";
    if (rows.length === 0) {
      list.appendChild(h("div", { class: "placeholder", text: empty }));
      return;
    }
    for (const node of rows) list.appendChild(node);
  }

  /**
   * The org's agent fleet.
   *
   * The API has answered `/agents` since the AI-native sections landed and the dashboard never
   * asked. It is the section most worth having: an agent with no human owner presents to every
   * downstream consumer exactly like one with a real owner, so the only way to see the difference
   * is a list that says so — which is also what `gaps` escalates.
   */
  async function loadAgents() {
    // The org-wide collection routes answer with `{ teamId, item }` — the resource itself is one
    // level down. Reading `entry.name` here would render a list of blanks, silently.
    const agents = (await getJson("/agents")).map((entry) => ({ ...entry.item, teamId: entry.teamId }));
    const active = agents.filter((a) => (a.status ?? "active") === "active");
    const unowned = agents.filter((a) => !a.ownerId);
    const providers = new Set(agents.map((a) => a.provider).filter(Boolean));

    const stats = document.getElementById("agent-stats");
    stats.innerHTML = "";
    stats.appendChild(stat(agents.length, "declared"));
    stats.appendChild(stat(active.length, "active"));
    stats.appendChild(stat(providers.size, "providers"));
    stats.appendChild(stat(unowned.length, "no owner", true));

    fillList(
      "agent-list",
      agents.map((agent) =>
        row(agent.name, agent.teamId, [
          agent.provider ? h("span", { class: "chip", text: agent.provider }) : null,
          (agent.status ?? "active") === "active"
            ? null
            : h("span", { class: "chip inactive", text: agent.status }),
          agent.ownerId
            ? h("span", { class: "chip", text: `owned by ${agent.ownerId}` })
            : h("span", { class: "chip unowned", title: "Nobody is accountable for what this produces", text: "no owner" }),
        ]),
      ),
      "No agents declared anywhere in the org.",
    );
  }

  /** AI collaboration sessions, newest first — the record of what was actually built with an
   * assistant, which is the other half of the agent roster and just as unexposed. */
  async function loadSessions() {
    const sessions = (await getJson("/sessions")).map((entry) => ({ ...entry.item, teamId: entry.teamId }));
    const sorted = [...sessions].sort((a, b) => String(b.startedAt ?? "").localeCompare(String(a.startedAt ?? "")));
    fillList(
      "session-list",
      sorted.map((session) =>
        row(session.objective ?? session.id, session.teamId, [
          session.assistant ? h("span", { class: "chip", text: session.assistant }) : null,
          session.startedAt ? h("span", { class: "chip", text: String(session.startedAt).slice(0, 10) }) : null,
          session.agentId ? h("span", { class: "chip", text: session.agentId }) : null,
        ]),
      ),
      "No sessions recorded.",
    );
  }

  /**
   * The context map as a list, alongside the diagram tab.
   *
   * The diagram shows the relationships; it cannot show the *conflicts*, which are two teams
   * describing one relationship differently — and that disagreement is the single most useful
   * thing this derivation produces, because it is organizational signal nobody wrote down.
   */
  async function loadContextMap() {
    const map = await getJson("/context-map");
    const conflicts = (map.conflicts ?? []).map((conflict) =>
      row(conflict.description, `${conflict.teamA} ↔ ${conflict.teamB}`, [
        h("span", { class: "chip unowned", text: "conflict" }),
      ]),
    );
    const relationships = (map.relationships ?? []).map((rel) =>
      row(`${rel.from} → ${rel.to}`, rel.mode, [
        rel.pattern ? h("span", { class: "chip", text: rel.pattern }) : null,
        rel.source === "heuristic" ? h("span", { class: "chip inactive", title: "Inferred from the interaction mode, not declared", text: "inferred" }) : null,
      ]),
    );
    // Conflicts first, unconditionally: a disagreement buried under thirty healthy relationships
    // is a disagreement nobody acts on.
    fillList("context-map-list", [...conflicts, ...relationships], "No interactions declared.");
  }

  /**
   * The knowledge graph, as a neighbourhood rather than a picture.
   *
   * `/knowledge-graph` returns every team, person, role, service, agent and document as one linked
   * graph, which is far too much to draw and exactly the right amount to walk. Picking a node and
   * traversing from it answers the question people actually have — "what is connected to this
   * ADR?" — which no diagram of the whole thing ever does.
   */
  async function loadKnowledgeGraph() {
    const graph = await getJson("/knowledge-graph");
    const select = document.getElementById("kg-node");
    const depth = document.getElementById("kg-depth");
    const summary = document.getElementById("kg-summary");

    const nodes = [...(graph.nodes ?? [])].sort((a, b) => `${a.kind}${a.label}`.localeCompare(`${b.kind}${b.label}`));
    summary.textContent = `${nodes.length} nodes, ${(graph.edges ?? []).length} edges`;

    select.innerHTML = "";
    for (const node of nodes) {
      select.appendChild(h("option", { value: node.id, text: `${node.kind}: ${node.label}` }));
    }

    async function traverse() {
      const nodeId = select.value;
      if (!nodeId) return;
      const scoped = await getJson(`/knowledge-graph/${encodeURIComponent(nodeId)}/traverse?depth=${depth.value}`);
      const byId = new Map((scoped.nodes ?? []).map((node) => [node.id, node]));
      fillList(
        "kg-list",
        (scoped.edges ?? []).map((edge) => {
          const from = byId.get(edge.from);
          const to = byId.get(edge.to);
          return row(`${from ? from.label : edge.from} → ${to ? to.label : edge.to}`, edge.relation, [
            to ? h("span", { class: "chip", text: to.kind }) : null,
          ]);
        }),
        "Nothing is connected to this node.",
      );
    }

    select.addEventListener("change", () => void traverse());
    depth.addEventListener("change", () => void traverse());
    if (nodes.length > 0) await traverse();
  }

  async function loadDiagram(scope) {
    const container = document.getElementById("diagram");
    container.innerHTML = "";
    container.appendChild(h("span", { class: "placeholder", text: "Rendering…" }));

    const url = scope === "context-map" ? "/context-map?format=mermaid" : `/diagrams/${scope}?format=mermaid`;
    let text;
    try {
      const res = await fetch(url);
      text = await res.text();
    } catch (err) {
      container.innerHTML = "";
      container.appendChild(h("span", { class: "placeholder", text: `Could not load diagram: ${err}` }));
      return;
    }

    let mermaid;
    try {
      mermaid = await loadMermaid();
    } catch (err) {
      container.innerHTML = "";
      container.appendChild(
        h("span", { class: "placeholder", text: "Could not load the diagram renderer (offline, or the CDN is blocked on this network)." }),
      );
      return;
    }

    container.innerHTML = "";
    const id = `mermaid-${scope}-${Date.now()}`;
    try {
      const { svg } = await mermaid.render(id, text);
      container.innerHTML = svg;
    } catch (err) {
      container.appendChild(h("span", { class: "placeholder", text: `Could not render diagram: ${err}` }));
    }
  }

  function wireTabs() {
    const tabs = document.getElementById("diagram-tabs");
    tabs.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-scope]");
      if (!btn) return;
      for (const b of tabs.querySelectorAll("button")) b.classList.remove("active");
      btn.classList.add("active");
      loadDiagram(btn.dataset.scope);
    });
  }

  function wireSearch() {
    const input = document.getElementById("search");
    const results = document.getElementById("search-results");
    let debounce;
    input.addEventListener("input", () => {
      clearTimeout(debounce);
      const q = input.value.trim();
      if (!q) {
        results.innerHTML = "";
        return;
      }
      debounce = setTimeout(async () => {
        let hits;
        try {
          hits = await getJson(`/search?q=${encodeURIComponent(q)}`);
        } catch (err) {
          results.textContent = `Search failed: ${err}`;
          return;
        }
        results.innerHTML = "";
        if (hits.length === 0) {
          results.appendChild(h("div", { text: "No matches." }));
          return;
        }
        const list = h("ul");
        for (const hit of hits.slice(0, 12)) {
          list.appendChild(
            h("li", {}, [
              h("span", { class: "search-kind", text: hit.kind }),
              h("span", { text: `${hit.label} — ${hit.teamId}` }),
            ]),
          );
        }
        results.appendChild(list);
      }, 200);
    });
  }

  async function init() {
    wireTabs();
    wireSearch();

    // Awaited before anything renders, since it decides whether the team panel offers an edit
    // form at all. It is one small request against the one route that never needs a token.
    await loadCapabilities();

    // Each section is independent: the org summary/team grid, the cognitive-load list, and the
    // diagram all come from separate requests and (in the diagram's case) a separate CDN
    // dependency — one failing must not blank out the sections that didn't.
    const results = await Promise.allSettled([
      loadSummary().then(renderTeamCards),
      loadCognitiveLoad(),
      loadChecks(),
      loadAgents(),
      loadSessions(),
      loadContextMap(),
      loadKnowledgeGraph(),
      loadDiagram("topology"),
    ]);

    // Each AI-native section says so itself when it fails, rather than sitting on "Loading…":
    // these routes are newer than the rest of the API, and a server built before them should
    // degrade to a message rather than to silence.
    const sections = [
      [3, "agent-list", "AI agents"],
      [4, "session-list", "Sessions"],
      [5, "context-map-list", "Context map"],
      [6, "kg-list", "Knowledge graph"],
    ];
    for (const [index, id, label] of sections) {
      if (results[index].status === "rejected") {
        const node = document.getElementById(id);
        node.innerHTML = "";
        node.appendChild(h("div", { class: "placeholder", text: `${label} unavailable: ${results[index].reason}` }));
      }
    }

    const summaryResult = results[0];
    if (summaryResult.status === "rejected") {
      document.getElementById("org-summary").textContent = `Failed to load teams: ${summaryResult.reason}`;
    }
    const loadResult = results[1];
    if (loadResult.status === "rejected") {
      document.getElementById("load-list").textContent = `Failed to load cognitive load: ${loadResult.reason}`;
    }
  }

  init();
</script>
</body>
</html>
