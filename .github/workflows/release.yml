name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full gate set, not just build + test. CI has already run this on the merged commit,
      # so this is redundant by design: publishing to npm is irreversible, and a release is the
      # one place where paying twice for the same checks is the cheaper mistake.
      - name: Verify
        run: pnpm verify

      # `id-token: write` is deliberately omitted. npm prefers OIDC whenever GitHub exposes it,
      # but each package must first trust this exact workflow on npmjs.com. Until that registry
      # configuration is in place, publishing uses the repository's scoped automation token and
      # disables provenance, which also requires an OIDC identity.
      #
      # If there are pending changesets, opens/updates a "Version Packages" PR instead of
      # publishing. Merging that PR (with no changesets left) re-runs this workflow and this
      # step publishes any package whose package.json version isn't yet on the npm registry.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
