name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ordered cheapest-first so an obvious failure reports in seconds rather than after a
      # full build. Every step runs even if an earlier one fails: a contributor should get the
      # whole list of what to fix in one run, not one item per push.
      - name: Format
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Dead code and unused dependencies
        if: ${{ !cancelled() }}
        run: pnpm deadcode

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

      # Runs the same suites as `pnpm test`, and additionally fails if any package drops below
      # the coverage floor in its vitest.config.ts.
      - name: Test with coverage
        if: ${{ !cancelled() }}
        run: pnpm test:coverage

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/*/coverage/lcov.info
          if-no-files-found: error
