clause: AI-native domains
requirement: >-
  Every resource in every AI-native array requires a slug id, unique within that array — validated
  the same way roles[].id and members[].id are.
files:
  team/teamapi.yml: |
    teamApiVersion: "1.0.0"
    id: team
    info:
      name: Team
      type: stream-aligned
    agents:
      - id: reviewer
        name: Reviewer
        provider: anthropic
        role: Reviews pull requests
      - id: reviewer
        name: Reviewer Two
        provider: anthropic
        role: Reviews pull requests too
expect:
  outcome: rejected
  reasonContains: "Duplicate id 'reviewer'"
