<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="title desc">
  <title id="title">TeamAPI</title>
  <desc id="desc">A team topology: an enabling team above two stream-aligned teams, resting on a platform</desc>

  <!-- enabling team -->
  <rect x="34" y="19.5" width="32" height="15" rx="7.5" fill="#fb7185"/>

  <!-- stream-aligned teams -->
  <rect x="14" y="42.5" width="32" height="15" rx="7.5" fill="#a78bfa"/>
  <rect x="54" y="42.5" width="32" height="15" rx="7.5" fill="#fbbf24"/>

  <!-- platform team -->
  <rect x="14" y="65.5" width="72" height="15" rx="7.5" fill="#2dd4bf"/>
</svg>
